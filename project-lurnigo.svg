<svg width="440" height="236" viewBox="0 0 440 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lurnigo — Online course marketplace">
  <title>Lurnigo — Online course marketplace</title>
  <desc>Instructor dashboards, student enrollment, content delivery and progress analytics in one place. Built with React, TypeScript, Bootstrap, REST API. lurnigo.com</desc>
  <defs>
    <linearGradient id="prbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050c1a"/><stop offset="100%" stop-color="#0a1a33"/>
    </linearGradient>
    <linearGradient id="prcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1c33"/><stop offset="100%" stop-color="#081325"/>
    </linearGradient>
    <linearGradient id="prstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="prgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="prglowA" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="prglowB" cx="90%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
