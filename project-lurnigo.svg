    <g><g transform="translate(401 202) scale(0.5833333333333334)" fill="none" stroke="#a78bfa" stroke-width="3.43" stroke-linecap="round" stroke-linejoin="round" color="#a78bfa"><path d="M7 17L17 7M9 7h8v8"/></g>
