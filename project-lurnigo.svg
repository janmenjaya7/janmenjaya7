    <g transform="translate(25.5 201.5) scale(0.625)" fill="none" stroke="#a78bfa" stroke-width="2.72" stroke-linecap="round" stroke-linejoin="round" color="#a78bfa"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5s1.3-6.8 3.9-9.5z"/></g>
