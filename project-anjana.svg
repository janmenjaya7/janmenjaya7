    <rect width="440" height="236" fill="url(#prdots)"/>
    <rect width="440" height="236" fill="url(#prspot)"/>
    <rect width="440" height="4" fill="url(#praccent)"/>
  </g>
  <rect x="0.6" y="0.6" width="438.8" height="234.8" rx="17.5" fill="none" stroke="#34d399" stroke-opacity="0.35"/>

  <g font-family="'Segoe UI',system-ui,-apple-system,sans-serif"><animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
