    <circle cx="366" cy="40" r="3.6" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="376" y="44.5" font-size="12" font-weight="700" fill="#86efac">Live</text>

    <text x="24" y="106" font-size="13.4" fill="#cbd5e1">Course management, HD video streaming, quiz engine,</text>
    <text x="24" y="126" font-size="13.4" fill="#cbd5e1">progress tracking and payments at national scale.</text>

    <g font-size="11.4" font-weight="600"><rect x="24" y="146" width="68" height="22" rx="11" fill="#111827" stroke="#334155"/><text x="58" y="161" text-anchor="middle" fill="#f8fafc">Next.js</text><rect x="98" y="146" width="55" height="22" rx="11" fill="#0c2535" stroke="#155e75"/><text x="125.5" y="161" text-anchor="middle" fill="#67e8f9">React</text><rect x="159" y="146" width="88" height="22" rx="11" fill="#0f1f3d" stroke="#1d4ed8"/><text x="203" y="161" text-anchor="middle" fill="#93c5fd">TypeScript</text><rect x="253" y="146" width="75" height="22" rx="11" fill="#2a1a12" stroke="#9a3412"/><text x="290.5" y="161" text-anchor="middle" fill="#fdba74">REST API</text></g>

    <line x1="24" y1="186" x2="416" y2="186" stroke="#1e3a5f"/>
    <g transform="translate(25.5 201.5) scale(0.625)" fill="none" stroke="#22d3ee" stroke-width="2.72" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5s1.3-6.8 3.9-9.5z"/></g>
    <text x="48" y="213.5" font-size="12.8" font-weight="600" fill="#e2e8f0">ifasonline.com</text>
    <text x="394" y="213.5" text-anchor="end" font-size="12.5" font-weight="700" fill="#22d3ee">50,000+ learners</text>
    <g><g transform="translate(401 202) scale(0.5833333333333334)" fill="none" stroke="#22d3ee" stroke-width="3.43" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee"><path d="M7 17L17 7M9 7h8v8"/></g>
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="1.8s" repeatCount="indefinite"/>
