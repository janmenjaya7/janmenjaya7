<svg width="440" height="236" viewBox="0 0 440 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IFAS Online — EdTech learning portal">
  <title>IFAS Online — EdTech learning portal</title>
  <desc>Course management, HD video streaming, quiz engine, progress tracking and payments at national scale. Built with Next.js, React, TypeScript, REST API. ifasonline.com</desc>
  <defs>
    <linearGradient id="prbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050c1a"/><stop offset="100%" stop-color="#0a1a33"/>
    </linearGradient>
    <linearGradient id="prcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1c33"/><stop offset="100%" stop-color="#081325"/>
    </linearGradient>
    <linearGradient id="prstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="prgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="prglowA" cx="15%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="prglowB" cx="90%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="prdots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#1e3a5f" opacity="0.55"/>
    </pattern>
    <filter id="prshadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="praccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="prspot" cx="92%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="prclip"><rect width="440" height="236" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#prclip)">
