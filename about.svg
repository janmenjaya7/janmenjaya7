<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About me — Janmenjaya Biswal">
  <title>About me — Janmenjaya Biswal</title>
  <desc>Frontend Developer with 3+ years building the IFAS EduTech platform family. Building EdTech products for 50,000+ learners, learning system design and web performance. Values: clean typed React, performance, mobile-first UI, teamwork.</desc>
