    <linearGradient id="abcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1c33"/><stop offset="100%" stop-color="#081325"/>
    </linearGradient>
    <linearGradient id="abstroke" x1="0" y1="0" x2="1" y2="1">
