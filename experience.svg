      <text x="114" y="151">Build and scale <tspan fill="#fff" font-weight="700">Next.js</tspan> applications with SSR / SSG — fast, SEO-friendly and production-ready</text>
      <text x="114" y="175">Integrated <tspan fill="#fff" font-weight="700">100+ REST APIs</tspan> end-to-end — authentication, courses, video streaming and payments</text>
      <text x="114" y="199">Designed reusable <tspan fill="#fff" font-weight="700">React + TypeScript</tspan> component libraries — <tspan fill="#22d3ee" font-weight="700">~30% faster</tspan> UI delivery</text>
      <text x="114" y="223">Optimised Webpack / Babel builds — leaner bundles and <tspan fill="#22d3ee" font-weight="700">~25% faster</tspan> page loads</text>
      <text x="114" y="247">Shipped an <tspan fill="#fff" font-weight="700">admin CRM</tspan> with role-based access, real-time reports and student progress tracking</text>
    </g>

