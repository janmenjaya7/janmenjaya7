      <text x="381" y="310" font-size="11.5" fill="#94a3b8">REST APIs integrated</text>

      <rect x="484" y="266" width="182" height="54" rx="10" fill="url(#xpTile)" stroke="#1e3a5f"/>
      <text x="575" y="291" font-size="21" font-weight="800" fill="url(#xpNum)">4</text>
      <text x="575" y="310" font-size="11.5" fill="#94a3b8">live products shipped</text>

      <rect x="678" y="266" width="182" height="54" rx="10" fill="url(#xpTile)" stroke="#1e3a5f"/>
      <text x="769" y="291" font-size="21" font-weight="800" fill="url(#xpNum)">~25%</text>
      <text x="769" y="310" font-size="11.5" fill="#94a3b8">faster page loads</text>
