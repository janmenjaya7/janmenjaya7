      <rect x="166" y="332" width="60" height="22" rx="11" fill="#0c2535" stroke="#155e75"/><text x="196" y="347" fill="#67e8f9">React</text>
      <rect x="232" y="332" width="84" height="22" rx="11" fill="#0f1f3d" stroke="#1d4ed8"/><text x="274" y="347" fill="#93c5fd">TypeScript</text>
      <rect x="322" y="332" width="90" height="22" rx="11" fill="#0f1f3d" stroke="#1e40af"/><text x="367" y="347" fill="#bfdbfe">Material UI</text>
      <rect x="418" y="332" width="80" height="22" rx="11" fill="#1c1538" stroke="#5b21b6"/><text x="458" y="347" fill="#c4b5fd">Bootstrap</text>
      <rect x="504" y="332" width="78" height="22" rx="11" fill="#2a1a12" stroke="#9a3412"/><text x="543" y="347" fill="#fdba74">REST APIs</text>
      <rect x="588" y="332" width="76" height="22" rx="11" fill="#0c2535" stroke="#0e7490"/><text x="626" y="347" fill="#a5f3fc">Webpack</text>
