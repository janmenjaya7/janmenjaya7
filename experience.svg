      <text x="114" y="475">Started my professional journey shipping production <tspan fill="#e2e8f0" font-weight="600">React.js</tspan> interfaces for EdTech products</text>
      <text x="114" y="499">Delivered mobile-first responsive UI, worked in Agile sprints and <tspan fill="#e2e8f0" font-weight="600">mentored 2 junior developers</tspan></text>
