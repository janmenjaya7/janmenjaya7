<svg width="900" height="530" viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="xpTitle xpDesc">
  <title id="xpTitle">Experience — Janmenjaya Biswal</title>
  <desc id="xpDesc">Frontend Developer at IFAS EduTech Pvt. Ltd. (current) and Frontend Developer at e2eHiring (previous, from Aug 2023).</desc>

  <defs>
